name: Build & Sign Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Web Production Bundle
        run: npm run build

      - name: 🔄 Capacitor Sync Android
        run: npx cap sync android

      - name: 🔐 Prepare Android Keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Keystore secret detected. Decoding..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No keystore secret found. Build will produce an unsigned/debug APK."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: ⚙️ Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK with Gradle
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi

      - name: ✍️ Sign Release APK
        id: sign_apk
        if: steps.keystore.outputs.has_keystore == 'true' && github.event.inputs.build_type != 'debug'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: 📦 Collect APK Artifact
        id: apk_file
        run: |
          if [ "${{ steps.keystore.outputs.has_keystore }}" == "true" ] && [ "${{ github.event.inputs.build_type }}" != "debug" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*-signed.apk" | head -n 1)
            [ -z "$APK_PATH" ] && APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          elif [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          else
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" whitevault-release.apk
          echo "apk_path=whitevault-release.apk" >> $GITHUB_OUTPUT

      - name: 🚀 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: white-vault-apk
          path: whitevault-release.apk
          retention-days: 30
