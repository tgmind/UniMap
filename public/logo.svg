<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#07090F" />
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#grad1)" stroke-width="3" opacity="0.3" stroke-dasharray="6,6" />
  
  <!-- Central Map Constellation Nodes -->
  <g filter="url(#glow)">
    <!-- Device connection lines -->
    <path d="M 60 70 L 100 50 L 140 70 L 140 130 L 100 150 L 60 130 Z" fill="none" stroke="url(#grad1)" stroke-width="2.5" opacity="0.6"/>
    <line x1="100" y1="50" x2="100" y2="150" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
    <line x1="60" y1="70" x2="140" y2="130" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
    <line x1="140" y1="70" x2="60" y2="130" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
    
    <!-- Outer nodes -->
    <circle cx="100" cy="50" r="7" fill="#8B5CF6" />
    <circle cx="140" cy="70" r="6" fill="#3B82F6" />
    <circle cx="140" cy="130" r="7" fill="#06B6D4" />
    <circle cx="100" cy="150" r="6" fill="#10B981" />
    <circle cx="60" cy="130" r="7" fill="#F59E0B" />
    <circle cx="60" cy="70" r="6" fill="#EC4899" />
    
    <!-- Central Core Universal Hub -->
    <circle cx="100" cy="100" r="14" fill="url(#grad1)" />
    <circle cx="100" cy="100" r="7" fill="#FFFFFF" />
  </g>
</svg>
