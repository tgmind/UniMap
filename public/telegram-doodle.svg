<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Paper Airplane -->
  <g transform="translate(40, 50) rotate(15)">
    <path d="M 0 10 L 25 0 L 10 25 L 8 13 Z" />
    <path d="M 8 13 L 25 0" />
  </g>
  
  <!-- Chat Bubble -->
  <g transform="translate(160, 40)">
    <rect x="0" y="0" width="26" height="18" rx="5" />
    <path d="M 6 18 L 3 23 L 12 18" />
  </g>

  <!-- Lightbulb -->
  <g transform="translate(280, 55)">
    <circle cx="10" cy="10" r="8" />
    <path d="M 7 18 L 13 18" />
    <path d="M 8 21 L 12 21" />
  </g>

  <!-- Star -->
  <g transform="translate(360, 30)">
    <polygon points="10,0 13,7 20,7 15,12 17,19 10,15 3,19 5,12 0,7 7,7" />
  </g>

  <!-- Heart -->
  <g transform="translate(80, 150)">
    <path d="M 12 5 C 9 1, 3 3, 3 8 C 3 14, 12 19, 12 19 C 12 19, 21 14, 21 8 C 21 3, 15 1, 12 5 Z" />
  </g>

  <!-- Cloud -->
  <g transform="translate(220, 140)">
    <path d="M 6 18 A 6 6 0 0 1 10 7 A 8 8 0 0 1 24 7 A 6 6 0 0 1 28 18 Z" />
  </g>

  <!-- Compass / Compass Needle -->
  <g transform="translate(330, 160)">
    <circle cx="12" cy="12" r="10" />
    <polygon points="12,5 15,12 12,19 9,12" />
  </g>

  <!-- Coffee Cup -->
  <g transform="translate(50, 260)">
    <rect x="0" y="4" width="18" height="14" rx="3" />
    <path d="M 18 7 C 22 7, 22 13, 18 13" />
    <path d="M 3 22 L 15 22" />
  </g>

  <!-- Music Note -->
  <g transform="translate(170, 250)">
    <circle cx="6" cy="18" r="4" />
    <path d="M 10 18 L 10 4 L 20 2 L 20 16" />
    <circle cx="16" cy="16" r="4" />
  </g>

  <!-- Happy Smile / Face -->
  <g transform="translate(290, 270)">
    <circle cx="12" cy="12" r="10" />
    <circle cx="8" cy="10" r="1" fill="currentColor" />
    <circle cx="16" cy="10" r="1" fill="currentColor" />
    <path d="M 8 15 Q 12 19 16 15" />
  </g>

  <!-- Sparkle / Asterisk -->
  <g transform="translate(120, 350)">
    <line x1="10" y1="2" x2="10" y2="18" />
    <line x1="2" y1="10" x2="18" y2="10" />
    <line x1="4" y1="4" x2="16" y2="16" />
    <line x1="4" y1="16" x2="16" y2="4" />
  </g>

  <!-- Globe / Earth -->
  <g transform="translate(240, 340)">
    <circle cx="12" cy="12" r="10" />
    <ellipse cx="12" cy="12" rx="4" ry="10" />
    <line x1="2" y1="12" x2="22" y2="12" />
  </g>

  <!-- Bookmark -->
  <g transform="translate(350, 350)">
    <path d="M 4 2 L 16 2 L 16 20 L 10 15 L 4 20 Z" />
  </g>
</svg>
